name: Metrics
on:
  # Atualiza todo dia às 03:00 (horário de Brasília)
  schedule: [{cron: "0 6 * * *"}]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card principal: perfil, atividade, comunidade, repositórios, linguagens e hábitos
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: davidcrp
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_octicon: yes
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
          plugin_habits: yes
          plugin_habits_charts: no
          plugin_habits_facts: yes
          plugin_habits_days: 14
          plugin_lines: yes

      # Calendário isométrico de contribuições do ano
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: davidcrp
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
